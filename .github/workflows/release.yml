name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Picnic-Trinkgeld-Tracker-Beta.apk
            Picnic-Trinkgeld-Tracker.apk
          name: Picnic Trinkgeld-Tracker ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body: |
            ### Picnic Trinkgeld-Tracker ${{ github.ref_name }}

            Offizielles Release-Paket mit kompilierter APK.
            
            Installationshinweise und Details findest du in der README.md.
