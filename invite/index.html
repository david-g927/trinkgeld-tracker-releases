<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freundschaftsanfrage – Picnic Trinkgeld-Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1E293B;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .code-badge {
      display: inline-block;
      background: rgba(225, 29, 72, 0.15);
      border: 2px dashed #E11D48;
      color: #FDA4AF;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      font-family: monospace;
      padding: 10px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      background: #E11D48;
      color: #FFFFFF;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .subtext {
      margin-top: 18px;
      font-size: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚗</div>
    <h1>Picnic Trinkgeld-Tracker</h1>
    <p>Freundschaftsanfrage für diesen Runner:</p>
    <div class="code-badge" id="runner-code">LÄDT...</div>
    <a href="#" id="open-btn" class="btn">In Trinkgeld-Tracker öffnen</a>
    <div class="subtext">Falls die App nicht öffnet, kopiere den Code und gib ihn im Tab „Mein Code“ ein.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    if (code) {
      document.getElementById('runner-code').innerText = code;
      const deepLink = 'trinkgeld://friend?code=' + encodeURIComponent(code);
      document.getElementById('open-btn').href = deepLink;
      // Automatisch versuchen, die App zu öffnen
      window.location.href = deepLink;
    } else {
      document.getElementById('runner-code').innerText = 'KEIN CODE';
      document.getElementById('open-btn').href = 'trinkgeld://';
    }
  </script>
</body>
</html>
